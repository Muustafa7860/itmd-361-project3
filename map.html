    <header>
      <h1>My Chicago Lakefront Map</h1>
      <p>Explore my favorite bike stops along Lake Michigan.</p>
    </header>
    <main>
      <section>
        <h2>Interactive Map</h2>
        <p>Click a marker to learn about a stop. Click anywhere on the map to drop your own marker.</p>
        <div class="controls">
          <button type="button" id="questions-btn">Questions</button>
          <button type="button" id="reset-btn">Reset View</button>
          <button type="button" id="clear-btn">Clear My Markers</button>
        </div>
        <p id="map-status" aria-live="polite">Loading map...</p>
        <div id="map"></div>
      </section>
    </main>

      <p>Back to my <a href="index.html">home page</a>.</p>
